name: Unpack project files

on:
  push:
    paths:
      - project.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        shell: bash
        run: |
          unzip -o project.zip -d extracted
          cp -a extracted/. .
          rm -rf project.zip extracted
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish project files [skip ci]"
          git push
